<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tulsidas Hostel Complaint Management</title>
    <meta name="description" content="Online maintenance portal for Tulsidas Hostel residents to register maintenance issues by category with Supabase backend integration for database storage and administration." />
    <meta property="og:title" content="Tulsidas Hostel Complaint Management" />
    <meta property="og:description" content="Online maintenance portal for Tulsidas Hostel residents to register maintenance issues by category with Supabase backend integration for database storage and administration." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        // Prevent Vite client HMR WebSocket crashes in environments where WebSocket connections are blocked
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWS = window.WebSocket;
          var SafeWS = function(url, protocols) {
            var isVite = (typeof protocols === 'string' && (protocols === 'vite-hmr' || protocols === 'vite-ping'))
              || (Array.isArray(protocols) && protocols.some(function(p) { return typeof p === 'string' && p.indexOf('vite') !== -1; }))
              || (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('@vite') !== -1 || url.indexOf('vite') !== -1));

            if (isVite) {
              var target = new EventTarget();
              return {
                readyState: 1, // OPEN
                OPEN: 1,
                CONNECTING: 0,
                CLOSING: 2,
                CLOSED: 3,
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener, options) {
                  target.addEventListener(type, listener, options);
                  if (type === 'open') {
                    setTimeout(function() {
                      try {
                        if (typeof listener === 'function') listener(new Event('open'));
                        else if (listener && listener.handleEvent) listener.handleEvent(new Event('open'));
                      } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function() { target.removeEventListener.apply(target, arguments); },
                dispatchEvent: function() { return target.dispatchEvent.apply(target, arguments); },
                set onopen(fn) { this.addEventListener('open', fn); },
                set onclose(fn) { this.addEventListener('close', fn); },
                set onerror(fn) { this.addEventListener('error', fn); },
                set onmessage(fn) { this.addEventListener('message', fn); }
              };
            }
            return new NativeWS(url, protocols);
          };
          SafeWS.prototype = NativeWS.prototype;
          SafeWS.CONNECTING = 0;
          SafeWS.OPEN = 1;
          SafeWS.CLOSING = 2;
          SafeWS.CLOSED = 3;
          window.WebSocket = SafeWS;
        }

        // Gracefully suppress any remaining WebSocket / @vite/client errors in iframe preview
        window.addEventListener('error', function(e) {
          if ((e.filename && e.filename.indexOf('@vite/client') !== -1) ||
              (e.message && e.message.indexOf('WebSocket') !== -1)) {
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason ? (e.reason.message || String(e.reason)) : '';
          var stack = e.reason && e.reason.stack ? String(e.reason.stack) : '';
          if (reason.indexOf('WebSocket') !== -1 ||
              reason.indexOf('@vite/client') !== -1 ||
              stack.indexOf('@vite/client') !== -1) {
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
